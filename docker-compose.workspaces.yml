# This file is regenerated by the platform whenever workspaces change.
# It is committed only as a template / starting point.
#
# The platform writes the live version to ./docker-compose.workspaces.yml at runtime
# (managed by app/src/services/docker.js).
#
# Example shape:

name: devplatform-workspaces

services:
  dev1-workspace:
    image: devplatform/code-server:latest
    container_name: dev1-workspace
    restart: unless-stopped
    environment:
      PASSWORD: "${DEV1_PASSWORD}"
      GIT_USER_NAME: "dev1"
      GIT_USER_EMAIL: "dev1@example.com"
    volumes:
      - ./workspaces/dev1/projects:/home/coder/projects
      - ./workspaces/dev1/config:/home/coder/.config
      - ./workspaces/dev1/claude:/home/coder/.claude
    # No host port exposure — nginx proxies via the docker network.
    networks:
      - devplatform-workspaces
    expose:
      - "8080"

networks:
  devplatform-workspaces:
    driver: bridge
